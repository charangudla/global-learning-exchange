services:
  postgres:
    image: postgres:16-alpine
    container_name: gle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: global_learning_exchange
      POSTGRES_USER: gle
      POSTGRES_PASSWORD: gle_dev_password
    ports:
      - "5432:5432"
    volumes:
      - gle_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gle -d global_learning_exchange"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gle_postgres_data:
